<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DITHERATE</title>
    <meta
      name="description"
      content="Upload an image, hit one button, get a randomly dithered version. Everything runs in your browser."
    />
    <link rel="icon" href="/assets/sparkle.svg" />
    <!--
      Inline so it applies on the very first paint. Without it the browser
      shows its default white page until the stylesheet arrives, which reads as
      a white flash before the intro cover appears.
    -->
    <style>
      html {
        background: #0a0a0a;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
    <div class="intro" id="intro" aria-hidden="true"></div>
    <div class="shell">
      <main class="column">
        <header class="header">
          <span class="wordmark" id="wordmark" role="img" aria-label="Ditherate">
            <span class="wordmark__shuffle" id="wordmarkShuffle" aria-hidden="true"></span>
          </span>
          <a
            class="chip"
            href="https://github.com/lithmaw/Ditherate"
            target="_blank"
            rel="noreferrer noopener"
          >
            <span class="chip__icon" aria-hidden="true"></span>
            <span>Star on GitHub</span>
          </a>
        </header>

        <div class="workspace">
          <section class="stage">
            <button
              type="button"
              class="dropbox"
              id="dropbox"
              aria-label="Upload an image"
            >
              <span class="dropbox__prompt" id="dropboxPrompt">
                <span class="dropbox__icon" aria-hidden="true"></span>
                <span>Upload Image</span>
              </span>
              <canvas class="dropbox__canvas" id="canvas" hidden></canvas>
              <span class="dropbox__pixels" id="canvasPixels" aria-hidden="true" hidden></span>
            </button>

            <p class="caption" id="caption" hidden></p>

            <div class="tools" id="tools" hidden>
              <div class="pselect" id="algorithmRoot">
                <button
                  type="button"
                  class="pselect__trigger"
                  id="algorithmTrigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span class="pselect__name">Algorithm</span>
                  <span class="pselect__value" id="algorithmValue"></span>
                  <span class="pselect__caret" aria-hidden="true"></span>
                </button>
                <div class="pselect__panel" id="algorithmPanel" tabindex="-1" hidden>
                  <ul class="pselect__list" id="algorithmList" role="listbox" aria-label="Algorithm"></ul>
                  <span class="pselect__pixels" id="algorithmPixels" aria-hidden="true"></span>
                </div>
              </div>
              <button
                type="button"
                class="tool"
                id="invertBtn"
                title="Invert this image and keep it as a new one"
              >
                <span class="tool__icon tool__icon--swap" aria-hidden="true"></span>
                <span>Invert</span>
              </button>
              <button type="button" class="tool" id="downloadBtn">
                <span class="tool__icon tool__icon--download" aria-hidden="true"></span>
                <span>Download PNG</span>
              </button>
            </div>

            <div class="history" id="history" hidden aria-label="Previous rolls"></div>
          </section>

          <button type="button" class="ditherate" id="ditherateBtn" disabled>
            <span class="ditherate__pixels" id="ditheratePixels" aria-hidden="true"></span>
            <span class="ditherate__label">Ditherate</span>
          </button>
        </div>

        <footer class="footer">
          <button type="button" class="footer__toggle" id="motionToggle" aria-pressed="true">
            <span class="footer__icon footer__icon--motion" aria-hidden="true"></span>
          </button>
          <button type="button" class="footer__toggle" id="soundToggle" aria-pressed="true">
            <span class="footer__icon footer__icon--sound" aria-hidden="true"></span>
          </button>
        </footer>
      </main>
    </div>

    <input type="file" id="fileInput" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
